name: Publish OTA Update

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - run: eas update --branch production --message "master@${{ github.sha }}" --non-interactive
